<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>《鹈鹕测试 × 67》画廊</title>
  <link rel="stylesheet" href="./public/style.css" />
  <style>
    html, body {
      overflow-y: auto !important;
      user-select: text !important;
      height: auto !important;
      background: #0e0d0b;
      color: #f3ede0;
      font-family: "PelicanSans", system-ui, -apple-system, sans-serif;
    }
    .wrap {
      max-width: 1480px;
      margin: 0 auto;
      padding: 28px 20px 80px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(212, 163, 115, 0.25);
      margin-bottom: 28px;
    }
    h1 {
      font-family: "PelicanSerif", serif;
      font-size: clamp(24px, 3vw, 34px);
      color: #f7f1e3;
      margin-bottom: 6px;
    }
    .sub {
      color: #b8ae9c;
      font-size: 14px;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      border-radius: 7px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(212, 163, 115, 0.45);
      background: #1d1915;
      color: #f0dfc4;
      transition: all 0.15s ease;
    }
    .btn.primary {
      background: #d4a373;
      color: #18130e;
      border-color: #d4a373;
    }
    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }
    .hero-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 36px;
    }
    .card {
      background: #171512;
      border: 1px solid rgba(226, 206, 170, 0.14);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
    }
    .card img {
      width: 100%;
      height: auto;
      display: block;
      cursor: zoom-in;
      background: #0a0908;
    }
    .card-body {
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }
    .card-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }
    .era-title {
      font-family: "PelicanSerif", serif;
      font-size: 18px;
      font-weight: 700;
      color: #f6efe0;
    }
    .era-tag {
      font-family: "PelicanMono", monospace;
      font-size: 12px;
      color: #d4a373;
      background: rgba(212, 163, 115, 0.12);
      padding: 2px 7px;
      border-radius: 4px;
      white-space: nowrap;
    }
    .era-desc {
      font-size: 13.5px;
      line-height: 1.55;
      color: #c5bcac;
    }
    .card-links {
      margin-top: auto;
      padding-top: 8px;
      display: flex;
      gap: 10px;
      font-size: 12.5px;
    }
    .card-links a, .card-links button {
      background: rgba(255, 255, 255, 0.05);
      color: #e4c199;
      border: 1px solid rgba(212, 163, 115, 0.28);
      border-radius: 5px;
      padding: 4px 9px;
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
      font-size: 12px;
    }
    .card-links a:hover, .card-links button:hover {
      background: rgba(212, 163, 115, 0.18);
    }
    h2 {
      font-family: "PelicanSerif", serif;
      font-size: 22px;
      margin: 12px 0 16px;
      color: #f3ead8;
    }
    .era-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 20px;
    }
    @media (max-width: 520px) {
      .era-grid {
        grid-template-columns: 1fr;
      }
    }
    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(6, 6, 5, 0.94);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 16px;
    }
    #lightbox.open {
      display: flex;
    }
    #lb-img {
      max-width: 96vw;
      max-height: 84vh;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.85);
    }
    #lb-bar {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 14px;
      color: #efe7d6;
      font-size: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }
    #lb-bar button, #lb-bar a {
      background: #25201b;
      color: #f3ead8;
      border: 1px solid rgba(212, 163, 115, 0.4);
      border-radius: 6px;
      padding: 6px 13px;
      cursor: pointer;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>《鹈鹕测试 × 67》画廊</h1>
      <a class="btn primary" href="./index.html">播放短片</a>
    </header>
    <div class="era-grid" id="era-grid"></div>
  </div>

  <div id="lightbox" onclick="if(event.target===this)closeLB()">
    <img id="lb-img" src="" alt="" />
    <div id="lb-bar">
      <button type="button" onclick="stepLB(-1)">← 上一张</button>
      <span id="lb-caption"></span>
      <a id="lb-raw" href="#" target="_blank">打开原图 ↗</a>
      <button type="button" onclick="stepLB(1)">下一张 →</button>
      <button type="button" onclick="closeLB()">关闭 ✕</button>
    </div>
  </div>

  <script type="module">
    import { SCENES } from './src/beat/timeline.js';
    const ERAS = SCENES.map(s => ({
      title: s.zh, date: s.era, desc: s.en,
      shot: './public/gallery/' + s.num + '.jpg', time: s.t0
    }));
    const lbItems = [];
    const grid = document.getElementById("era-grid");
    ERAS.forEach((era) => {
      const idx = lbItems.length;
      lbItems.push({ src: era.shot, cap: `${era.title}（${era.date}）` });
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <img src="${era.shot}" alt="${era.title}" data-lb="${idx}" loading="lazy" />
        <div class="card-body">
          <div class="card-head">
            <span class="era-title">${era.title}</span>
            <span class="era-tag">${era.date}</span>
          </div>
          <div class="era-desc">${era.desc}</div>
          <div class="card-links">
            <button type="button" onclick="openLB(${idx})">放大 1080p 定格</button>
            <a href="./index.html?t=${era.time}">从此处观看</a>
            <a href="${era.shot}" target="_blank">原图 ↗</a>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });

    let curLB = 0;
    const lb = document.getElementById("lightbox");
    const lbImg = document.getElementById("lb-img");
    const lbCap = document.getElementById("lb-caption");
    const lbRaw = document.getElementById("lb-raw");

    function openLB(i) {
      curLB = (i + lbItems.length) % lbItems.length;
      const item = lbItems[curLB];
      lbImg.src = item.src;
      lbCap.textContent = `${curLB + 1} / ${lbItems.length} · ${item.cap}`;
      lbRaw.href = item.src;
      lb.classList.add("open");
    }
    function closeLB() {
      lb.classList.remove("open");
    }
    function stepLB(d) {
      openLB(curLB + d);
    }
    document.querySelectorAll("img[data-lb]").forEach(el => {
      el.addEventListener("click", () => openLB(Number(el.dataset.lb)));
    });
    Object.assign(window, { openLB, closeLB, stepLB });
    window.addEventListener("keydown", (e) => {
      if (!lb.classList.contains("open")) return;
      if (e.key === "Escape") closeLB();
      if (e.key === "ArrowLeft") stepLB(-1);
      if (e.key === "ArrowRight") stepLB(1);
    });
  </script>
</body>
</html>
